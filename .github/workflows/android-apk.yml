
      - name: Extrair projeto
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP encontrado no repositório"
            exit 1
          fi
          echo "Arquivo encontrado: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d projeto
          PROJECT_DIR="$(dirname "$(find projeto -name settings.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Não foi encontrado settings.gradle dentro do ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
